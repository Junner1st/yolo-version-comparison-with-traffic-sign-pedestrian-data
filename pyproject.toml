[project]
name = "yolo-version-comparison"
version = "0.1.0"
description = "Systematic YOLO version comparison runner for reproducible experiments."
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pillow>=10.0",
    "pyte>=0.8.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
    "ultralytics>=8.3.0",
]

[project.scripts]
yolo-compare = "yolo_compare.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yolo_compare"]
