[project]
name = "yolo-version-comparison"
version = "0.1.0"
description = "Systematic YOLO version comparison runner for reproducible experiments."
requires-python = ">=3.11,<3.12"
dependencies = [
    "addict>=2.4.0",
    "gitpython>=3.1.50",
    "ipython>=9.13.0",
    "matplotlib>=3.8",
    "numpy<2",
    "pandas>=2.2",
    "pillow<10",
    "pycocotools>=2.0.11",
    "pyte>=0.8.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
    "tensorboard>=2.4.1",
    "tqdm>=4.41.0",
    "ultralytics>=8.3.0",
]

[project.scripts]
yolo-compare = "yolo_compare.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yolo_compare"]
